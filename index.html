<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gAi • Growing Brain</title><link rel="stylesheet" href="./style.css"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-dot">🧠</div><span>gAi</span></div><button class="new-chat" id="newChat"><span>＋ New chat</span></button><div class="chat-list" id="chatList"></div><div class="sidebar-bottom"><a class="side-link" href="https://github.com/Iammdtanvirrahman2007/gAi" target="_blank">⚙ gAi Brain</a></div></aside><section class="main"><header class="topbar"><div class="model-name">gAi <span style="color:#777">Local Brain</span></div><div class="model-status" id="modelStatus">● Ready</div></header><div class="chat-scroll" id="chatScroll"><main class="chat-inner" id="chatInner"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Local AI • No API • Your conversations stay in your browser</p><div class="empty-suggestions"><button class="suggestion">Explain something to me</button><button class="suggestion">Help me write code</button><button class="suggestion">Analyze some data</button><button class="suggestion">Teach gAi something</button></div></div></main></div></section></div><div class="composer-wrap"><div class="composer"><textarea id="chatInput" rows="1" placeholder="Message gAi..."></textarea><button class="stop" id="stopBtn">Stop</button><button class="send" id="sendBtn" aria-label="Send">↑</button></div><div class="composer-note">gAi runs locally. No external AI API is used.</div></div><script type="module">import * as ChatEngine from './brain/chat_engine.js';const KEY='gAiChatsV1';const $=id=>document.getElementById(id);let chats=load();let current=null;let busy=false;let abort=false;function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(chats.slice(-50)))}catch{}}function makeChat(){return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:'New chat',messages:[],created:Date.now(),updated:Date.now()}}function active(){if(!current){current=makeChat();chats.push(current);save()}return current}function escape(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function renderList(){const box=$('chatList');box.innerHTML=chats.slice().reverse().map(c=>`<div class="chat-item ${c.id===current?.id?'active':''}" data-id="${c.id}">💬 <span>${escape(c.title||'New chat')}</span></div>`).join('');box.querySelectorAll('.chat-item').forEach(x=>x.onclick=()=>{current=chats.find(c=>c.id===x.dataset.id);render()})}function render(){const c=active();const inner=$('chatInner');if(!c.messages.length){inner.innerHTML=`<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Local AI • No API • Your conversations stay in your browser</p><div class="empty-suggestions"><button class="suggestion">Explain something to me</button><button class="suggestion">Help me write code</button><button class="suggestion">Analyze some data</button><button class="suggestion">Teach gAi something</button></div></div>`;inner.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('chatInput').value=b.textContent;send()});return}inner.innerHTML=c.messages.map(m=>`<div class="message ${m.role}"><div class="avatar">${m.role==='user'?'U':'G'}</div><div class="message-body"><div class="message-role">${m.role==='user'?'You':'gAi'}</div><div class="message-text">${escape(m.content)}</div></div></div>`).join('');scrollBottom()}function scrollBottom(){const s=$('chatScroll');requestAnimationFrame(()=>s.scrollTop=s.scrollHeight)}function resize(){const x=$('chatInput');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,180)+'px'}async function answer(prompt,history){return await ChatEngine.answer(prompt,history)}async function send(){if(busy)return;const input=$('chatInput');const text=input.value.trim();if(!text)return;const c=active();if(!c.messages.length)c.title=text.slice(0,38);c.messages.push({role:'user',content:text,time:Date.now()});c.updated=Date.now();input.value='';resize();save();renderList();render();busy=true;abort=false;$('sendBtn').disabled=true;$('stopBtn').style.display='block';$('modelStatus').textContent='● Thinking';const placeholder={role:'assistant',content:'',time:Date.now(),typing:true};c.messages.push(placeholder);render();try{const result=await answer(text,c.messages.slice(0,-1));if(!abort)placeholder.content=result;else placeholder.content='Generation stopped.'}catch(e){placeholder.content='Something went wrong while generating a response.'}placeholder.typing=false;c.updated=Date.now();save();busy=false;$('sendBtn').disabled=false;$('stopBtn').style.display='none';$('modelStatus').textContent='● Ready';render()}$('chatInput').addEventListener('input',resize);$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('sendBtn').onclick=send;$('stopBtn').onclick=()=>{abort=true;$('modelStatus').textContent='● Stopping'};$('newChat').onclick=()=>{current=makeChat();chats.push(current);save();renderList();render();$('chatInput').focus()};if(!chats.length)current=makeChat();else current=chats[chats.length-1];renderList();render();$('chatInput').focus();window.gAiChat={send,newChat:()=>$('newChat').click(),chats};</script></body></html>
