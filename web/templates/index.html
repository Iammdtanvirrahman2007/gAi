<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>gAi • Growing Brain</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>🧠 gAi</h1><span>Human-guided Growing AI</span></header>
  <main>
    <section class="card"><h2>Teach</h2><input id="topic" placeholder="Topic"><textarea id="content" placeholder="What are you teaching gAi?"></textarea><button onclick="teach()">Teach gAi</button><p id="teachStatus"></p></section>
    <section class="card"><h2>Code Request</h2><input id="capability" placeholder="Capability needed"><input id="target" placeholder="Required file path"><textarea id="reason" placeholder="Why does gAi need it?"></textarea><textarea id="requirements" placeholder="Requirements, one per line"></textarea><button onclick="requestCode()">Create Request</button><p id="requestStatus"></p></section>
    <section class="card"><h2>Brain Memory</h2><div id="lessons">Loading...</div></section>
    <section class="card"><h2>Pending Code Requests</h2><div id="requests">Loading...</div></section>
  </main>
<script>
async function refresh(){const s=await fetch('/api/state').then(r=>r.json()); lessons.innerHTML=s.lessons.length?s.lessons.map(x=>`<article><b>${escapeHtml(x.topic)}</b><p>${escapeHtml(x.content)}</p></article>`).join(''):'No lessons yet.'; requests.innerHTML=s.code_requests.length?s.code_requests.map(x=>`<div class="request">📝 ${escapeHtml(x)}</div>`).join(''):'No pending requests.'}
async function teach(){const r=await fetch('/api/learn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,content:content.value})});teachStatus.textContent=r.ok?'✓ Lesson learned.':'⚠ '+(await r.json()).error;if(r.ok){topic.value='';content.value='';refresh()}}
async function requestCode(){const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capability:capability.value,reason:reason.value,target_file:target.value,requirements:requirements.value.split('\n')})});requestStatus.textContent=r.ok?'✓ Request created: '+(await r.json()).file:'⚠ '+(await r.json()).error;if(r.ok){capability.value='';target.value='';reason.value='';requirements.value='';refresh()}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} refresh();
</script>
</body></html>
